<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>버거타임</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.84); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:42px; font-weight:900; letter-spacing:.03em; color:#ffd23a; text-shadow:0 3px 0 #a83a0a; }
  #overlay h2 { font-size:26px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay p b { color:#ffd23a; font-weight:700; }
  #overlay .big { font-size:30px; font-weight:900; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#fff0a8,#ff9a2e); color:#3a1a00; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #a83a0a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #a83a0a; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 폰 조작판: 왼쪽 십자(◀ ▶ 걷기, ▲ ▼ 사다리) · 오른쪽 큰 후추 버튼 */
  #controls { display:none; width:100%; justify-content:space-between; align-items:center; padding:0 12px; gap:12px; }
  #dpad { display:grid; grid-template-columns:repeat(3,62px); grid-template-rows:repeat(3,54px); gap:4px; touch-action:none; }
  #dpad button, #pepperBt { border-radius:16px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.8); font-size:24px; touch-action:none; }
  #dpad .u { grid-column:2; grid-row:1; } #dpad .l { grid-column:1; grid-row:2; } #dpad .r { grid-column:3; grid-row:2; } #dpad .d { grid-column:2; grid-row:3; }
  #pepperBt { flex:1; max-width:150px; height:100px; background:rgba(255,200,60,.25); border-color:rgba(255,210,100,.5); font-size:20px; font-weight:900; line-height:1.3; }
  #dpad button.on, #pepperBt.on { background:rgba(255,210,58,.45); color:#fff; transform:scale(.95); }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
  @media (pointer:coarse) { #controls { display:flex; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>버거타임</h1>
      <p>철골 위를 걸으며 <b>재료를 밟아</b> 한 층씩 떨어뜨려<br>접시에 <b>햄버거 네 개</b>를 쌓아요! 🍔<br>쫓아오는 소시지·달걀·피클은 <b>후추</b>로 멈춰요</p>
      <div class="help">
        <span class="pc">⌨️ ← → 걷기 · ↑ ↓ 사다리 · 스페이스(Z) 후추 · P 일시정지 · M 소리</span>
        <span class="touch">👆 ◀ ▶ 걷기 · ▲ ▼ 사다리 · 오른쪽 큰 버튼 후추</span>
      </div>
      <button id="startBtn">시작하기</button>
    </div>
  </div>
  <div id="controls">
    <div id="dpad"><button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button><button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button></div>
    <button id="pepperBt">🧂<br>후추</button>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
